<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Personal Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo">MyPortfolio.</a>
            <div class="menu-toggle" id="mobile-menu">
                <span></span><span></span><span></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-item">Home</a></li>
                <li><a href="about.html" class="nav-item">About</a></li>
                <li><a href="projects.html" class="nav-item">Projects</a></li>
                <li><a href="contact.html" class="nav-item active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-content">
        <h2 class="section-title">Contact Me</h2>
        <div class="contact-container">
            <form class="contact-form" id="portfolioForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Your Email">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" required placeholder="Your Message..."></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Developer Portfolio. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
